spring:
  datasource:
    url: jdbc:h2:mem:employeedb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true   # run data.sql after tables are created
  h2:
    console:
      enabled: true                          # http://localhost:8080/h2-console
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100                   # nobody can request size=1000000

server:
  port: 8080
